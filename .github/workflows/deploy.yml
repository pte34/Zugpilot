name: Deploy to GitHub Pages

on:
  push:
    # main ist der eigentliche Trunk; claude/zugpilot-pwa-learning-c0i0mt ist
    # (Stand jetzt) noch der Repo-Default-Branch, auf den die automatisch
    # angelegte "github-pages"-Umgebung Deploys beschraenkt. Sobald der
    # Default-Branch in den Repo-Einstellungen auf main umgestellt ist,
    # kann der zweite Eintrag hier wieder raus.
    branches: [main, claude/zugpilot-pwa-learning-c0i0mt]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GH_PAGES: 'true'
          # In den Repo-Einstellungen unter "Settings -> Secrets and variables
          # -> Actions" anlegen, sobald die Supabase-Anbindung genutzt wird.
          # Ohne diese Secrets baut die App weiterhin, laeuft dann aber ohne
          # Supabase-Sync (siehe src/lib/supabaseClient.ts).
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
